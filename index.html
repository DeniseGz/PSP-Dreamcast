<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Pink Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Carcasa física de la PSP Rosada -->
    <div class="psp-shell">
        
        <!-- Controles esquinas transparentes -->
        <div class="shoulder-left">L</div>
        <div class="shoulder-right">R</div>

        <!-- Controles izquierdos -->
        <div class="psp-left-controls">
            <div class="d-pad">
                <button class="d-btn d-up" onclick="prevScene()">▲</button>
                <button class="d-btn d-left" onclick="prevScene()">◀</button>
                <div class="d-btn d-center"></div>
                <button class="d-btn d-right" onclick="nextScene()">▶</button>
                <button class="d-btn d-down" onclick="nextScene()">▼</button>
            </div>
            <div class="analog-stick"></div>
        </div>

        <!-- PANTALLA LCD (100% Ocupada por el video/GIF) -->
        <div class="psp-screen" id="pspScreen">
            <div id="mediaDisplay" class="media-full"></div>
        </div>

        <!-- Controles derechos -->
        <div class="psp-right-controls">
            <div class="action-buttons">
                <button class="psp-btn btn-triangle" onclick="nextScene()">▲</button>
                <button class="psp-btn btn-square" onclick="prevScene()">■</button>
                <button class="psp-btn btn-circle" onclick="nextScene()">◯</button>
                <button class="psp-btn btn-cross" onclick="prevScene()">✕</button>
            </div>
            <div class="power-hold-indicators">
                <span class="indicator power-on"></span> POWER
            </div>
        </div>

        <!-- Barra inferior de botones PSP -->
        <div class="psp-bottom-bar">
            <button class="sys-btn">HOME</button>
            <button class="sys-btn">- VOL +</button>
            <span class="psp-logo-text">P S P</span>
            <button class="sys-btn">♪</button>
            <button class="sys-btn" onclick="prevScene()">SELECT</button>
            <button class="sys-btn" onclick="nextScene()">START</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
