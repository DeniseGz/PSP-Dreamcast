<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Dreamcast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .psp-container {
            position: relative;
            width: 850px;
            max-width: 95vw;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        /* PANTALLA LCD / VISOR DE MEDIOS */
        .psp-screen-overlay {
            position: absolute;
            top: 21.5% !important;
            left: 22.8% !important;
            width: 54.4% !important;
            height: 64.5% !important;
            background: #000 !important;
            overflow: hidden !important;
            border-radius: 2px !important;
            z-index: 1 !important;
            display: block !important;
        }

        .psp-screen-overlay img,
        .psp-screen-overlay video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            display: block !important;
        }

        /* EFECTO LINTERNA / NEÓN SUAVE AL PASAR EL CURSOR */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 999;
            background: transparent !important;
            border-radius: 50%;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .hotspot:hover {
            background: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        /* TUS COORDENADAS EXACTAS DE BOTONES */
        .dpad-left   { top: 46.5%; left: 7.8%;  width: 3.8%; height: 6.2%; border-radius: 4px; }
        .dpad-right  { top: 46.5%; left: 14.8%; width: 3.8%; height: 6.2%; border-radius: 4px; }
        .dpad-up     { top: 41%;   left: 11.3%; width: 3.8%; height: 6.2%; border-radius: 4px; }
        .dpad-down   { top: 52%;   left: 11.3%; width: 3.8%; height: 6.2%; border-radius: 4px; }

        .btn-triangle { top: 41%;   left: 84.5%; width: 3.8%; height: 6.2%; }
        .btn-circle   { top: 46.5%; left: 89.8%; width: 3.8%; height: 6.2%; }
        .btn-cross    { top: 52%;   left: 84.5%; width: 3.8%; height: 6.2%; }
        .btn-square   { top: 46.5%; left: 79.2%; width: 3.8%; height: 6.2%; }

        .vol-down    { top: 73.2%; left: 34.2%; width: 3.8%; height: 4.8%; border-radius: 15px; }
        .vol-up      { top: 73.2%; left: 38.8%; width: 3.8%; height: 4.8%; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="psp-container">
        <img src="assets/psp-console.png" alt="PSP Console" class="psp-image">

        <!-- Pantalla LCD inicializada con el primer contenido asegurado -->
        <div class="psp-screen-overlay" id="mediaDisplay">
            <img src="assets/nier.jpg" alt="Scene" style="width: 100%; height: 100%; object-fit: fill; display: block;">
        </div>

        <!-- Hotspots D-Pad -->
        <div class="hotspot dpad-left" onclick="prevScene()" title="Anterior"></div>
        <div class="hotspot dpad-right" onclick="nextScene()" title="Siguiente"></div>
        <div class="hotspot dpad-up" onclick="prevScene()" title="Anterior"></div>
        <div class="hotspot dpad-down" onclick="nextScene()" title="Siguiente"></div>

        <!-- Hotspots Botones de Acción -->
        <div class="hotspot btn-triangle" onclick="nextScene()" title="Siguiente"></div>
        <div class="hotspot btn-circle" onclick="nextScene()" title="Siguiente"></div>
        <div class="hotspot btn-cross" onclick="prevScene()" title="Anterior"></div>
        <div class="hotspot btn-square" onclick="prevScene()" title="Anterior"></div>

        <!-- Hotspots Volumen -->
        <div class="hotspot vol-down" onclick="volumeDown()" title="Volumen -"></div>
        <div class="hotspot vol-up" onclick="volumeUp()" title="Volumen +"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
