<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .psp-container {
            position: relative;
            width: 850px;
            max-width: 95vw;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* PANTALLA LCD AJUSTADA Y LLENA */
        .psp-screen-overlay {
            position: absolute;
            top: 21.5%;
            left: 22.8%;
            width: 54.4%;
            height: 64.5%;
            background: #000;
            overflow: hidden;
            border-radius: 2px;
            z-index: 1;
        }

        .psp-screen-overlay img,
        .psp-screen-overlay video {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Forzar que cubra todo el espacio sin marcos vacíos */
            display: block;
        }

        /* ESTILOS DE HOTSPOTS INTERACTIVOS */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            /* background: rgba(255, 0, 0, 0.3); */ /* Descomentá esta línea si querés ver los recuadros rojos para calibrar */
        }

        /* D-PAD (Flechas Izquierda) */
        .dpad-left   { top: 48%;   left: 7.5%;  width: 4%; height: 7%; }
        .dpad-right  { top: 48%;   left: 14.5%; width: 4%; height: 7%; }
        .dpad-up     { top: 42%;   left: 11%;   width: 4%; height: 7%; }
        .dpad-down   { top: 54.5%; left: 11%;   width: 4%; height: 7%; }

        /* BOTONES DE ACCIÓN (Derecha) */
        .btn-triangle { top: 42%;   left: 84.8%; width: 4.2%; height: 7%; }
        .btn-circle   { top: 48.5%; left: 88.5%; width: 4.2%; height: 7%; }
        .btn-cross    { top: 55%;   left: 84.8%; width: 4.2%; height: 7%; }
        .btn-square   { top: 48.5%; left: 81.2%; width: 4.2%; height: 7%; }

        /* BOTONES INFERIORES DE VOLUMEN */
        .vol-down    { top: 72.8%; left: 34.5%; width: 4%; height: 5%; }
        .vol-up      { top: 72.8%; left: 39%;   width: 4%; height: 5%; }
    </style>
</head>
<body>

    <div class="psp-container">
        <!-- Imagen de la PSP de fondo -->
        <img src="assets/psp-console.png" alt="PSP Console" class="psp-image">

        <!-- Pantalla interactiva -->
        <div class="psp-screen-overlay" id="mediaDisplay"></div>

        <!-- Hotspots D-Pad (Flechas) -->
        <div class="hotspot dpad-left" onclick="prevScene()"></div>
        <div class="hotspot dpad-right" onclick="nextScene()"></div>
        <div class="hotspot dpad-up" onclick="prevScene()"></div>
        <div class="hotspot dpad-down" onclick="nextScene()"></div>

        <!-- Hotspots Botones Figuras -->
        <div class="hotspot btn-triangle" onclick="nextScene()"></div>
        <div class="hotspot btn-circle" onclick="nextScene()"></div>
        <div class="hotspot btn-cross" onclick="prevScene()"></div>
        <div class="hotspot btn-square" onclick="prevScene()"></div>

        <!-- Hotspots Volumen -->
        <div class="hotspot vol-down" onclick="volumeDown()"></div>
        <div class="hotspot vol-up" onclick="volumeUp()"></div>
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
