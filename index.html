<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Dreamcast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .psp-container {
            position: relative;
            width: 850px;
            max-width: 95vw;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* PANTALLA LCD LLENA */
        .psp-screen-overlay {
            position: absolute;
            top: 21.5%;
            left: 22.8%;
            width: 54.4%;
            height: 64.5%;
            background: #000;
            overflow: hidden;
            border-radius: 2px;
            z-index: 1;
        }

        .psp-screen-overlay img,
        .psp-screen-overlay video {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* HOTSPOTS INTERACTIVOS */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            /* Sacá las dos barras de la línea de abajo si querés ver los recuadros rojos para probar los clics: */
            /* background: rgba(255, 0, 0, 0.4); */
        }

        /* D-PAD (Flechas Izquierda) - Corregidas más hacia la derecha */
        .dpad-left   { top: 48.5%; left: 9.5%;  width: 4%;   height: 6%; }
        .dpad-right  { top: 48.5%; left: 16.5%; width: 4%;   height: 6%; }
        .dpad-up     { top: 42.5%; left: 13%;   width: 4%;   height: 6%; }
        .dpad-down   { top: 54.5%; left: 13%;   width: 4%;   height: 6%; }

        /* BOTONES DE ACCIÓN (Derecha) - Corregidas más hacia la izquierda */
        .btn-triangle { top: 42.5%; left: 81.5%; width: 4.5%; height: 6.5%; }
        .btn-circle   { top: 48.5%; left: 86.5%; width: 4.5%; height: 6.5%; }
        .btn-cross    { top: 54.5%; left: 81.5%; width: 4.5%; height: 6.5%; }
        .btn-square   { top: 48.5%; left: 76.5%; width: 4.5%; height: 6.5%; }

        /* BOTONES DE VOLUMEN (Abajo) */
        .vol-down    { top: 73%;   left: 34%;   width: 4.5%; height: 5%; }
        .vol-up      { top: 73%;   left: 38.8%; width: 4.5%; height: 5%; }
    </style>
</head>
<body>

    <div class="psp-container">
        <img src="assets/psp-console.png" alt="PSP Console" class="psp-image">

        <div class="psp-screen-overlay" id="mediaDisplay"></div>

        <!-- Flechas D-Pad -->
        <div class="hotspot dpad-left" onclick="prevScene()"></div>
        <div class="hotspot dpad-right" onclick="nextScene()"></div>
        <div class="hotspot dpad-up" onclick="prevScene()"></div>
        <div class="hotspot dpad-down" onclick="nextScene()"></div>

        <!-- Botones de Acción -->
        <div class="hotspot btn-triangle" onclick="nextScene()"></div>
        <div class="hotspot btn-circle" onclick="nextScene()"></div>
        <div class="hotspot btn-cross" onclick="prevScene()"></div>
        <div class="hotspot btn-square" onclick="prevScene()"></div>

        <!-- Botones de Volumen -->
        <div class="hotspot vol-down" onclick="volumeDown()"></div>
        <div class="hotspot vol-up" onclick="volumeUp()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
