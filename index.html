<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP - Dreamcast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .psp-container {
            position: relative;
            width: 850px;
            max-width: 95vw;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Pantalla adaptada para cubrir el visor negro exacto */
.psp-screen-overlay {
    position: absolute;
    top: 21.5%;
    left: 22.8%;
    width: 54.4%;
    height: 64.5%;
    background: #000;
    overflow: hidden;
    border-radius: 2px;
}

/* Asegurar que las imágenes y videos llenen la pantalla de lado a lado */
.psp-screen-overlay img,
.psp-screen-overlay video {
    width: 100%;
    height: 100%;
    object-fit: fill; /* Cambiado a fill para forzar que ocupe todo el rectángulo si el video es de otra proporción */
    display: block;
}

/* Estilo para que los hotspots de los botones sean interactivos (podes sacarle el background-color cuando termines de ubicaros) */
.hotspot {
    position: absolute;
    cursor: pointer;
    z-index: 20;
}

        .dpad-left { top: 48%; left: 16%; width: 35px; height: 35px; }
        .dpad-right { top: 48%; left: 22.5%; width: 35px; height: 35px; }
        .dpad-up { top: 41.5%; left: 19.3%; width: 35px; height: 35px; }
        .dpad-down { top: 54.5%; left: 19.3%; width: 35px; height: 35px; }

        .btn-triangle { top: 38.5%; right: 18.5%; width: 35px; height: 35px; }
        .btn-circle { top: 47.5%; right: 14.5%; width: 35px; height: 35px; }
        .btn-cross { top: 56.5%; right: 18.5%; width: 35px; height: 35px; }
        .btn-square { top: 47.5%; right: 22.5%; width: 35px; height: 35px; }
    </style>
</head>
<body>

    <div class="psp-container">
        <img src="assets/psp-console.png" alt="PSP Console" class="psp-image">
        
        <div class="psp-screen-overlay" id="mediaDisplay"></div>

        <div class="hotspot dpad-left" onclick="prevScene()"></div>
        <div class="hotspot dpad-right" onclick="nextScene()"></div>
        <div class="hotspot dpad-up" onclick="prevScene()"></div>
        <div class="hotspot dpad-down" onclick="nextScene()"></div>
        
        <div class="hotspot btn-triangle" onclick="nextScene()"></div>
        <div class="hotspot btn-circle" onclick="nextScene()"></div>
        <div class="hotspot btn-cross" onclick="prevScene()"></div>
        <div class="hotspot btn-square" onclick="prevScene()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

    <div class="hotspot vol-up" onclick="volumeUp()"></div>
