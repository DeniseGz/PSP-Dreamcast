<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Pink Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .psp-container {
            position: relative;
            width: 900px;
            display: inline-block;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CALIBRACIÓN ABSOLUTA DEFINITIVA PARA CUBRIR EL LCD */
        .psp-screen-overlay {
            position: absolute;
            top: 27.5%;
            left: 29.8%;
            width: 41.5%;
            height: 41.5%;
            background: #000;
            overflow: hidden;
            border-radius: 2px;
        }

        .psp-screen-overlay img, 
        .psp-screen-overlay video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block;
        }

        /* BOTONES TÁCTILES INVISIBLES */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
        }

        .dpad-left { top: 48%; left: 16%; width: 35px; height: 35px; }
        .dpad-right { top: 48%; left: 22.5%; width: 35px; height: 35px; }
        .dpad-up { top: 41.5%; left: 19.3%; width: 35px; height: 35px; }
        .dpad-down { top: 54.5%; left: 19.3%; width: 35px; height: 35px; }

        .btn-triangle { top: 38.5%; right: 18.5%; width: 35px; height: 35px; }
        .btn-circle { top: 47.5%; right: 14.5%; width: 35px; height: 35px; }
        .btn-cross { top: 56.5%; right: 18.5%; width: 35px; height: 35px; }
        .btn-square { top: 47.5%; right: 22.5%; width: 35px; height: 35px; }
    </style>
