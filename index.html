<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Dreamcast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .psp-container {
            position: relative;
            width: 850px;
            max-width: 95vw;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        /* PANTALLA LCD EXACTA Y AJUSTADA AL MARCO NEGRO */
        .psp-screen-overlay {
            position: absolute;
            top: 21.2%;
            left: 22.5%;
            width: 55%;
            height: 65.2%;
            background: #000;
            overflow: hidden;
            border-radius: 2px;
            z-index: 1;
        }

        .psp-screen-overlay img,
        .psp-screen-overlay video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            display: block;
        }

        /* HOTSPOTS CON NEÓN BLANCO PURO (Inmunes a extensiones oscuras) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 999;
            background: transparent !important;
            border-radius: 50%;
            transition: background 0.1s ease, box-shadow 0.1s ease;
        }

        /* Forzar luz blanca brillante al pasar el cursor */
        .hotspot:hover {
            background: rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 0 15px #ffffff, 0 0 5px #ffffff inset !important;
            border: 1.5px solid #ffffff !important;
        }

        /* D-PAD (Flechas Izquierda) */
        .dpad-left   { top: 46.5%; left: 7.5%;  width: 4.2%; height: 6.5%; border-radius: 4px; }
        .dpad-right  { top: 46.5%; left: 15.2%; width: 4.2%; height: 6.5%; border-radius: 4px; }
        .dpad-up     { top: 40.5%; left: 11.3%; width: 4.2%; height: 6.5%; border-radius: 4px; }
        .dpad-down   { top: 52.5%; left: 11.3%; width: 4.2%; height: 6.5%; border-radius: 4px; }

        /* BOTONES DE ACCIÓN (Derecha - Alineados con precisión quirúrgica) */
        .btn-triangle { top: 40.5%; left: 84.5%; width: 4.2%; height: 6.5%; }
        .btn-circle   { top: 46.5%; left: 89.8%; width: 4.2%; height: 6.5%; }
        .btn-cross    { top: 52.5%; left: 84.5%; width: 4.2%; height: 6.5%; }
        .btn-square   { top: 46.5%; left: 79.2%; width: 4.2%; height: 6.5%; }

        /* BOTONES DE VOLUMEN (Abajo a la izquierda de la cruceta central) */
        .vol-down    { top: 73.2%; left: 34.2%; width: 4.2%; height: 5%; border-radius: 15px; }
        .vol-up      { top: 73.2%; left: 38.8%; width: 4.2%; height: 5%; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="psp-container">
        <img src="assets/psp-console.png" alt="PSP Console" class="psp-image">

        <div class="psp-screen-overlay" id="mediaDisplay"></div>

        <!-- Hotspots D-Pad -->
        <div class="hotspot dpad-left" onclick="prevScene()"></div>
        <div class="hotspot dpad-right" onclick="nextScene()"></div>
        <div class="hotspot dpad-up" onclick="prevScene()"></div>
        <div class="hotspot dpad-down" onclick="nextScene()"></div>

        <!-- Hotspots Botones Figuras -->
        <div class="hotspot btn-triangle" onclick="nextScene()"></div>
        <div class="hotspot btn-circle" onclick="nextScene()"></div>
        <div class="hotspot btn-cross" onclick="prevScene()"></div>
        <div class="hotspot btn-square" onclick="prevScene()"></div>

        <!-- Hotspots Volumen -->
        <div class="hotspot vol-down" onclick="volumeDown()"></div>
        <div class="hotspot vol-up" onclick="volumeUp()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
