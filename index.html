<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Dreamcast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .psp-container {
            position: relative;
            width: 850px;
            max-width: 95vw;
        }

        .psp-image {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* PANTALLA LCD LLENA */
        .psp-screen-overlay {
            position: absolute;
            top: 21.5%;
            left: 22.8%;
            width: 54.4%;
            height: 64.5%;
            background: #000;
            overflow: hidden;
            border-radius: 2px;
            z-index: 1;
        }

        .psp-screen-overlay img,
        .psp-screen-overlay video {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* HOTSPOTS INTERACTIVOS CON EFECTO NEÓN BLANCO AL PASAR EL MOUSE */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            background: transparent;
            border-radius: 50%; /* Por defecto circulares para adaptarse a los botones */
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        /* Efecto luz de neón blanca sutil al hacer hover */
        .hotspot:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6), inset 0 0 5px rgba(255, 255, 255, 0.4);
        }

        /* D-PAD (Flechas Izquierda) - Ajustadas con forma cuadrada/cruz */
        .dpad-left   { top: 46%;   left: 8%;    width: 4.5%; height: 6.5%; border-radius: 4px; }
        .dpad-right  { top: 46%;   left: 15%;   width: 4.5%; height: 6.5%; border-radius: 4px; }
        .dpad-up     { top: 40%;   left: 11.5%; width: 4.5%; height: 6.5%; border-radius: 4px; }
        .dpad-down   { top: 52%;   left: 11.5%; width: 4.5%; height: 6.5%; border-radius: 4px; }

        /* BOTONES DE ACCIÓN (Derecha) - Circulares */
        .btn-triangle { top: 40%;   left: 83%;   width: 4.5%; height: 6.5%; }
        .btn-circle   { top: 46%;   left: 88%;   width: 4.5%; height: 6.5%; }
        .btn-cross    { top: 52%;   left: 83%;   width: 4.5%; height: 6.5%; }
        .btn-square   { top: 46%;   left: 78%;   width: 4.5%; height: 6.5%; }

        /* BOTONES DE VOLUMEN (Abajo) */
        .vol-down    { top: 72%;   left: 34%;   width: 4.5%; height: 5.5%; border-radius: 50px; }
        .vol-up      { top: 72%;   left: 39%;   width: 4.5%; height: 5.5%; border-radius: 50px; }
    </style>
</head>
<body>

    <div class="psp-container">
        <img src="assets/psp-console.png" alt="PSP Console" class="psp-image">

        <div class="psp-screen-overlay" id="mediaDisplay"></div>

        <!-- Flechas D-Pad -->
        <div class="hotspot dpad-left" onclick="prevScene()"></div>
        <div class="hotspot dpad-right" onclick="nextScene()"></div>
        <div class="hotspot dpad-up" onclick="prevScene()"></div>
        <div class="hotspot dpad-down" onclick="nextScene()"></div>

        <!-- Botones de Acción -->
        <div class="hotspot btn-triangle" onclick="nextScene()"></div>
        <div class="hotspot btn-circle" onclick="nextScene()"></div>
        <div class="hotspot btn-cross" onclick="prevScene()"></div>
        <div class="hotspot btn-square" onclick="prevScene()"></div>

        <!-- Botones de Volumen -->
        <div class="hotspot vol-down" onclick="volumeDown()"></div>
        <div class="hotspot vol-up" onclick="volumeUp()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
